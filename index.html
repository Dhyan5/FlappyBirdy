<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird - Leaderboard Edition</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="ui">
        <div id="scoreWrapper">
            <span id="scoreLabel">SCORE</span>
            <div id="scoreVal">0</div>
        </div>
    </div>

    <div id="overlay" class="overlay">
        <div id="menuContent" class="glass-panel">
            <h1 id="overlayTitle">FLAPPY BIRD</h1>
            <p id="overlaySubtitle">PRESS SPACE OR TAP TO START</p>

            <div id="nameEntrySection">
                <hr>
                <label for="playerNameInput" id="nameLabel">ENTER YOUR NAME</label>
                <div id="nameInputRow">
                    <input
                        type="text"
                        id="playerNameInput"
                        maxlength="24"
                        autocomplete="off"
                        spellcheck="false"
                        placeholder="YOUR NAME">
                    <button type="button" id="saveNameBtn">SAVE</button>
                </div>
                <p id="nameHint" class="name-hint">YOU MUST ENTER A NAME BEFORE PLAYING</p>
            </div>

            <div id="leaderboardSection" class="hidden">
                <hr>
                <h3>TOP FLIGHTS</h3>
                <ol id="leaderboardList"></ol>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="game.js"></script>
</body>
</html>
